# Vendored from https://github.com/paradigmxyz/solar @ v0.2.0.
# Manifest rewritten to be self-contained (workspace inheritance removed); see crates/vendor/VENDOR.md.

[package]
name = "solar-macros"
description = "Internal Solar compiler macros"
homepage = "https://github.com/paradigmxyz/solar/tree/main/crates/macros"
version = "0.2.0"
authors = ["DaniPopes <57450786+DaniPopes@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paradigmxyz/solar"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits"] }

[features]
nightly = []
