# Vendored from https://github.com/paradigmxyz/solar @ v0.2.0.
# Manifest rewritten to be self-contained (workspace inheritance removed); see crates/vendor/VENDOR.md.

[package]
name = "solar-data-structures"
description = "Common data structures and utilities for the Solar compiler"
homepage = "https://github.com/paradigmxyz/solar/tree/main/crates/data-structures"
version = "0.2.0"
authors = ["DaniPopes <57450786+DaniPopes@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paradigmxyz/solar"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[dependencies]
bumpalo = "3.14"
oxc_index = { version = "5.0", features = ["nonmax"] }
indexmap = "2.2"
parking_lot = "0.12"
rayon = "1.8"
rustc-hash = "2.0"
smallvec = { version = "1", features = ["const_generics", "union"] }

[features]
nightly = [
    "parking_lot/nightly",
    # TODO: doesn't compile anymore
    # "rustc-hash/nightly",
    "smallvec/may_dangle",
    "smallvec/specialization",
]
