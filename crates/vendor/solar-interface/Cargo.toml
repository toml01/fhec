# Vendored from https://github.com/paradigmxyz/solar @ v0.2.0.
# Manifest rewritten to be self-contained (workspace inheritance removed); see crates/vendor/VENDOR.md.

[package]
name = "solar-interface"
description = "Source positions, diagnostics, and related helper functions"
homepage = "https://github.com/paradigmxyz/solar/tree/main/crates/interface"
version = "0.2.0"
authors = ["DaniPopes <57450786+DaniPopes@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paradigmxyz/solar"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[dependencies]
solar-config = { version = "=0.2.0", path = "../solar-config", default-features = false }
solar-data-structures = { version = "=0.2.0", path = "../solar-data-structures", default-features = false }
solar-macros = { version = "=0.2.0", path = "../solar-macros", default-features = false }

derive_more = { version = "2.0", features = ["full"] }
semver = "1.0"
thiserror = ">=1"

dunce = "1"
inturn = "0.2.0"
itertools = ">=0.10, <=0.15"
itoa = "1.0"
normalize-path = "0.2.1"
once_map = { version = "0.4.20", default-features = false, features = ["std"] }
rayon = "1.8"
scoped-tls = "1.0"
tracing = "0.1"
unicode-width = "0.2"

# diagnostics
anstream = "1.0.0"
anstyle = "1.0"
annotate-snippets = { version = "0.12", features = ["simd"] }

# json
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
snapbox = { version = "1.2", features = ["json"] }
tempfile = "3.9"
tracing-subscriber = "0.3"

[features]
json = ["dep:serde", "dep:serde_json"]

nightly = ["solar-data-structures/nightly", "solar-macros/nightly"]
