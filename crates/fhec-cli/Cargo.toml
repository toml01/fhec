[package]
name = "fhec-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "`fhec` binary: build/check/init/explain/clean"

[lib]
name = "fhec_cli"
path = "src/lib.rs"

[[bin]]
name = "fhec"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
fhec-syntax = { path = "../fhec-syntax" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
