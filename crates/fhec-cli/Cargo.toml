[package]
name = "fhec-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "`fhec` binary: build/check/init/explain/clean"

[lib]
name = "fhec_cli"
path = "src/lib.rs"

[[bin]]
name = "fhec"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
fhec-bind = { path = "../fhec-bind" }
fhec-check = { path = "../fhec-check" }
fhec-emit = { path = "../fhec-emit" }
fhec-ir = { path = "../fhec-ir" }
fhec-lower = { path = "../fhec-lower" }
fhec-syntax = { path = "../fhec-syntax" }
fhec-targets = { path = "../fhec-targets" }
fhec-verify = { path = "../fhec-verify" }
globset = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
