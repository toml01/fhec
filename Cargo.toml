[workspace]
resolver = "2"
members = [
    "crates/fhec-syntax",
    "crates/fhec-bind",
    "crates/fhec-check",
    "crates/fhec-ir",
    "crates/fhec-targets",
    "crates/fhec-lower",
    "crates/fhec-emit",
    "crates/fhec-verify",
    "crates/fhec-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/toml01/fhec"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }

# forked solar parser: https://github.com/toml01/solar
# compare: https://github.com/paradigmxyz/solar/compare/v0.2.0...toml01:solar:fhec
solar-parse = { git = "https://github.com/toml01/solar", rev = "1ec41158b6685a25aa826cbc3d0105e96e834ea8" }
solar-ast = { git = "https://github.com/toml01/solar", rev = "1ec41158b6685a25aa826cbc3d0105e96e834ea8" }
solar-interface = { git = "https://github.com/toml01/solar", rev = "1ec41158b6685a25aa826cbc3d0105e96e834ea8" }
solar-data-structures = { git = "https://github.com/toml01/solar", rev = "1ec41158b6685a25aa826cbc3d0105e96e834ea8" }
