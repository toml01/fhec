version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Bump the solar fork rev in Cargo.toml by hand after merging upstream on
    # toml01/solar's fhec branch.
    ignore:
      - dependency-name: solar-parse
      - dependency-name: solar-ast
      - dependency-name: solar-interface
      - dependency-name: solar-data-structures
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Differential harness targets Hardhat 2 (@cofhe/hardhat-plugin peer line).
      - dependency-name: hardhat
        versions: [">=3"]
      # Hardhat 3 plugin; deferred with the Hardhat 3 migration.
      - dependency-name: "@nomicfoundation/hardhat-ethers"
        versions: [">=4"]
      # Hardhat 3 plugin; deferred with the Hardhat 3 migration.
      - dependency-name: "@nomicfoundation/hardhat-network-helpers"
        versions: [">=3"]
      # Hardhat 3 / deprecation-stub major; deferred with the Hardhat 3 migration.
      - dependency-name: "@nomicfoundation/hardhat-chai-matchers"
        versions: [">=3"]
      # Pinned hardhat-chai-matchers 2.x requires chai ^4.
      - dependency-name: chai
        versions: [">=5"]
      # Harness pins its TypeScript toolchain; majors are adopted deliberately.
      - dependency-name: typescript
        versions: [">=6"]
      # Harness runs Node 22 (package.json engines / CI setup-node 22).
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
