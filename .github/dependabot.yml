version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependencies below exist in this workspace *only* for the vendored solar
    # parser fork under crates/vendor/. Those six manifests must keep upstream's
    # dependency requirements unchanged (crates/vendor/VENDOR.md: "Dependency
    # versions and feature sets are unchanged"), so a bump there would break the
    # byte-identical-to-upstream guarantee. No fhec-* crate declares any of them
    # directly; they reach fhec crates only through solar-*, and the transitive
    # copies of these crates that fhec code does pull in (e.g. syn via
    # clap_derive / serde_derive) are resolved by Cargo, not by Dependabot.
    # Re-check this list whenever crates/vendor/ is re-vendored to a newer tag.
    ignore:
      # crates/vendor/solar-parse, crates/vendor/solar-interface
      - dependency-name: itertools
      # crates/vendor/solar-macros
      - dependency-name: syn
      # crates/vendor/solar-parse
      - dependency-name: num-bigint
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Differential harness targets Hardhat 2 (@cofhe/hardhat-plugin peer line).
      - dependency-name: hardhat
        versions: [">=3"]
      # Harness pins its TypeScript toolchain; majors are adopted deliberately.
      - dependency-name: typescript
        versions: [">=6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
