name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
# Keep this pin in sync with rust-toolchain.toml (the action ignores that file).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # fmt and clippy are scoped to fhec crates: vendored solar code (crates/vendor/)
      # is kept byte-identical to upstream and is not reformatted or linted by us.
      - name: Check formatting
        run: cargo fmt -p fhec-syntax -p fhec-bind -p fhec-check -p fhec-ir -p fhec-targets -p fhec-lower -p fhec-emit -p fhec-verify -p fhec-cli --check
      - name: Lint
        run: cargo clippy -p fhec-syntax -p fhec-bind -p fhec-check -p fhec-ir -p fhec-targets -p fhec-lower -p fhec-emit -p fhec-verify -p fhec-cli --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm -r run --if-present build
